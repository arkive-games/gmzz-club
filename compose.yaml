services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: club
      POSTGRES_USER: club
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - club-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U club -d club"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    ports:
      - "127.0.0.1:${PORT:-19080}:19080"
    environment:
      DATABASE_URL: postgres://club:${POSTGRES_PASSWORD}@db:5432/club?sslmode=disable
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  club-data:
